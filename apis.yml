aid: bellhops
name: Bellhops
description: >-
  Bellhops (branded as Bellhop) is a US technology-enabled moving-services
  company that operates an online booking platform for residential and
  commercial relocations. Customers get a free estimate and reserve local
  moves, long-distance relocations, hourly moving labor, packing help, and
  last-minute moves with no money down, then manage their reservation through
  an online dashboard staffed by background-checked movers. The company reports
  more than 300,000 completed moves and a 4.8/5 average rating across 20,000+
  reviews. It was surfaced as a portfolio company of Canaan Partners and
  Initialized Capital and added to the API Evangelist network. Bellhops is a
  consumer-facing service with no publicly documented API, developer portal, or
  programmatic integration surface as of this profile.
